<html>

<body>
  <form>
    <label>
      <h2>Enter numbers for array</h2>
    </label>
    <label>Enter number 1</label>
    <input type="text" id="num1" name="numbers"><br>
    <label>Enter number 2</label>
    <input type="text" id="num2" name="numbers"><br>
    <label>Enter number 3</label>
    <input type="text" id="num3" name="numbers"><br>
    <label>Enter number 4</label>
    <input type="text" id="num4" name="numbers"><br>
    <button type="submit" onsubmit="calculate()" name="numbers">Calculate</button>
  </form>
  <div>
    <form>
      <label>
        <h2>Results</h2>
      </label>
      <label>Minimum</label>
      <input type="text" id="min" name="result"><br>
      <label>Maximum</label>
      <input type="text" id="max" name="result"><br>
      <label>Sum</label>
      <input type="text" id="sum" name="result"><br>
      <label>Average</label>
      <input type="text" id="avg" name="result"><br>
    </form>
  </div>
</body>
<script>
  let arr = [];
  function calculate() {
    const num1 = parseInt(document.getElementById("num1").value);
    arr.push(num1);
    const num2 = parseInt(document.getElementById("num2").value);
    arr.push(num2);
    const num1 = parseInt(document.getElementById("num3").value);
    arr.push(num3);
    const num1 = parseInt(document.getElementById("num4").value);
    arr.push(num4);
    
    const min=Math.min(arr);
    const max=Math.max(arr);
    let sum= 0;
    for (let i=0;i<arr.length;i++)
      {
        sum=sum+arr[i];
      }
    let avg=(sum)=>sum/4;

    document.getElementById("min").value=min;
    document.getElementById("max").value=max;
    document.getElementById("sum").value=sum;
    document.getElementById("avg").value=avg;
  }
</script>

</html>
